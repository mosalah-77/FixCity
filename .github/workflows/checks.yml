name: FixCity checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Flutter 3.35.7
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and build
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/demo.dart lib/demo_page.dart lib/report_actions.dart lib/report_media.dart test
          flutter analyze --no-fatal-infos
          flutter test --dart-define=DEMO_MODE=true
          flutter test
          flutter build web --release --base-href /FixCity/ --pwa-strategy=none --dart-define-from-file=demo-config.json
          flutter build apk --debug --dart-define-from-file=demo-config.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app/build/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-for-testing
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check isolation, consistency and demo limits
        run: |
          docker run --rm -d --name fixcity-demo-test-db -e POSTGRES_HOST_AUTH_METHOD=trust postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          for n in $(seq 1 30); do docker exec fixcity-demo-test-db pg_isready -U postgres && break; sleep 1; done
          bash supabase/tests/run-local.sh
      - if: always()
        run: docker stop fixcity-demo-test-db || true
